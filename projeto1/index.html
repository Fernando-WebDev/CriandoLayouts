<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina De Login</title>
    <link rel="stylesheet" href="/projeto1/style.css">
</head>
<body>
    <header>
        <h1 class="titlee">Seja bem-vindo(a) ao meu site</h1>
    </header>

    <main class="primary-box">
        <section class="left">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Rem commodi, cumque quas, cupiditate nisi sunt iste harum quis fugit quibusdam eos fuga a quos repellat reiciendis? Placeat iure laboriosam beatae? </p>
            <img src="/projeto1/media/foto-login.png" alt="foto de login">
        </section>

        <section class="right">
            <form>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome...">

                <label for="gmail">Gmail/Email:</label>
                <input type="email" id="gmail" placeholder="exemplo@email.com">

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="senha123">

                <button type="submit" class="enviar">
                    Entrar
                </button>
            </form>
        </section>
    </main>

    <footer>
        <p>Direitos reservado por EuMesmo 2026</p>
    </footer>
</body>
</html>
